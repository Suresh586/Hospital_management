{% extends "base.html" %}

{% block patients_active %}active{% endblock %}

{% block title %}
CarePlus | Delete Patient
{% endblock %}


{% block content %}

<div class="delete-patient-page">

    <div class="delete-patient-card">

        <div class="delete-icon">
            <i class="fa-solid fa-trash"></i>
        </div>

        <h1>
            Delete Patient?
        </h1>

        <p>
            Are you sure you want to delete
            <strong>{{ patient.name }}</strong>
            ({{ patient.patient_id }})?
        </p>

        <div class="delete-actions">

            <a
                href="{% url 'patients' %}"
                class="delete-cancel"
            >
                Cancel
            </a>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="delete-confirm"
                >
                    Delete Patient
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
